[workspace]
resolver = "3"
members = ["crates/gateway-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The code uses let chains, which need 1.88. CI's msrv job builds the crate at
# this version, so the number is proven and never repeated in the workflow.
rust-version = "1.88"
license = "BSL-1.0"
repository = "https://github.com/cppalliance/gateway-client"

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` makes `from_str` reproduce the exact `f64` that
# `to_string` printed, so a timing parsed from a reply equals the one a
# Host records.
serde_json = { version = "1", features = ["float_roundtrip"] }
# 0.13 rather than 0.12 so a program that links this crate gets exactly one
# rustls crypto backend, aws-lc-rs. 0.13 has no `ring` option, so a bump
# cannot re-enable it; CI checks that `ring` stays out of the normal
# dependency graph. Root certificates come from the OS trust store through
# the platform verifier (the `rustls` feature's default). `query` became
# opt-in in 0.13. `system-proxy` makes reqwest honor Windows registry and
# macOS proxies.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream", "system-proxy"] }
url = "2"
tokio = { version = "1", features = ["time"] }
# Dev-only: the mock servers that the client's tests send real requests to.
axum = "0.8"

# The dylint libraries `cargo dylint --all` runs. The lints live in their
# own repository, shared across the runvil project, because they build on
# their own nightly with `rustc_private`. Moving to a newer lint set is a
# change of `rev`.
[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/cppalliance/dylints", rev = "982b297ede90d37cdf8f3bf9995d1d706dcc51d4" }]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
future_incompatible = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
unescaped_backticks = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exit = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# Cherry-picked out of pedantic: it flags product names (Runvil, OpenAI) in
# prose, which reads worse backticked than the lint is worth.
doc_markdown = "allow"
# Cherry-picked out of pedantic: its suggested rewrite for a collection is
# `assert_eq!(x, [] as [T; 0])`, which has to spell out the element type and
# needs `T: PartialEq + Debug`, so it cannot be applied to most call sites.
assert_is_empty = "allow"
